name: Python package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --editable '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest --cov=intergenic_regions --cov-report=term-missing
      - run: python -m build
  minimal-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python examples/make_demo.py --output-dir /tmp/minimal-inputs
      - run: >-
          python -m intergenic_regions extract
          --genome /tmp/minimal-inputs/genome.fasta
          --annotation /tmp/minimal-inputs/genes.gff3
          --genes /tmp/minimal-inputs/positive_genes.txt
          --length 1000 --output-dir /tmp/minimal-extraction
