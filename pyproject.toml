[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intergenic-regions"
version = "1.1.0"
description = "Strand-aware intergenic extraction, motif enrichment and interpretable sequence learning"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Peter Thorpe"}]
dependencies = ["pyfaidx>=0.8.1,<1"]

[project.optional-dependencies]
motifs = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]
ml = ["intergenic-regions[motifs]", "scikit-learn>=1.5,<2"]
analysis = ["intergenic-regions[ml]", "shap>=0.47,<0.51"]
dev = ["intergenic-regions[analysis]", "pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<3", "build>=1.2,<2"]

[project.scripts]
intergenic-regions = "intergenic_regions.cli:main"

[project.urls]
Repository = "https://github.com/peterthorpe5/intergenic_regions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intergenic_regions = ["py.typed", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: complete command-line workflows"]

[tool.coverage.run]
branch = true
source = ["intergenic_regions"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
